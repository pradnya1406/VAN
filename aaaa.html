<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>LinkedIn Login Clone</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #ffffff;
            font-family: Arial, sans-serif;
        }
        .main-title {
            color: #8f5849;
            font-size: 42px;
            font-weight: 500;
        }
        .signin-btn {
            background-color: #0a66c2;
            border: none;
            font-size: 18px;
            padding: 10px;
        }
        .signin-btn:hover {
            background-color: #004182;
        }
        .forgot {
            color: #0a66c2;
            text-decoration: none;
            font-weight: 500;
        }
        .forgot:hover {
            text-decoration: underline;
        }
        .top-links a {
            margin-right: 15px;
            text-decoration: none;
            color: gray;
            font-size: 14px;
        }
        .illustration {
            background-color: #f3f2ef;
            border-radius: 50%;
            padding: 40px;
        }
    </style>
</head>

<body>

<!-- Navbar -->
<nav class="navbar navbar-light bg-white px-5">
    <a class="navbar-brand fw-bold text-primary fs-3">LinkedIn</a>
    <div class="top-links">
        <a href="#">Articles</a>
        <a href="#">People</a>
        <a href="#">Learning</a>
        <a href="#">Jobs</a>
        <a href="#" class="btn btn-outline-primary btn-sm ms-3">Sign in</a>
    </div>
</nav>

<!-- Main Section -->
<div class="container mt-5">
    <div class="row align-items-center">

        <!-- Left Login Form -->
        <div class="col-md-6">
            <h1 class="main-title mb-4">Welcome to your professional community</h1>

            <form>
                <div class="mb-3">
                    <label class="form-label">Email or phone</label>
                    <input type="text" class="form-control" placeholder="">
                </div>

                <div class="mb-2">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-control">
                </div>

                <a href="#" class="forgot d-block mb-3">Forgot password?</a>

                <button type="submit" class="btn btn-primary w-100 signin-btn">
                    Sign in
                </button>
            </form>
        </div>

        <!-- Right Illustration -->
        <div class="col-md-6 text-center">
            <div class="illustration">
                <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png"
                     alt="Work Illustration"
                     class="img-fluid"
                     width="300">
            </div>
        </div>

    </div>
</div>

</body>
</html>
